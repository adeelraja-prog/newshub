name: Adeel Raja Queued Reel Publisher

on:
  push:
    paths:
      - ".github/workflows/reels-publisher.yml"
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adeel-raja-reels-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news-hub/requirements-reels.txt
      - name: Install FFmpeg and Urdu font support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2 libraqm0 fonts-noto-core
      - name: Install Reels dependencies
        run: |
          pip install -r news-hub/requirements.txt
          pip install -r news-hub/requirements-reels.txt
      - name: Validate Reel editor syntax
        working-directory: news-hub
        run: python -m py_compile reels_main.py
      - name: Restore persistent Reel queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/reels-state
          cd /tmp/reels-state
          git init -q
          git config user.name "adeel-raja-reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git remote add origin "$REMOTE"
          if git ls-remote --exit-code --heads "$REMOTE" reels-data >/dev/null 2>&1; then
            git fetch -q origin reels-data
            git checkout -q -B reels-data FETCH_HEAD
          else
            git checkout -q -b reels-data
          fi
          touch clips-processed.json
          mkdir -p reports
      - name: Optional YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > news-hub/cookies.txt
            echo "YouTube cookie file supplied to the downloader."
          else
            echo "::warning::YT_COOKIES is not configured; queued video downloads may be blocked."
          fi
      - name: Render and publish one queued Reel to Facebook
        working-directory: news-hub
        env:
          REEL_STATE_FILE: /tmp/reels-state/clips-processed.json
          REEL_REPORT_DIR: /tmp/reels-state/reports
          REEL_RUN_MODE: publish
          REEL_MODE: blur
          REEL_MIN_GAP_MINUTES: "360"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python reels_main.py
      - name: Upload Reel processing reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: adeel-raja-reel-publisher-reports
          path: /tmp/reels-state/reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save persistent Reel queue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd /tmp/reels-state
          git add clips-processed.json
          if ! git diff --cached --quiet; then
            git commit -m "reels: publish queued clip and save state"
            git push -u origin HEAD:reels-data
          fi
