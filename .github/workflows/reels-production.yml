name: Adeel Raja Reels Production

on:
  workflow_run:
    workflows: ["news-hub"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: adeel-raja-reels-production
  cancel-in-progress: false

jobs:
  reels:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news-hub/requirements-reels.txt

      - name: Install FFmpeg and Urdu font support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Reels dependencies
        run: |
          pip install -r news-hub/requirements.txt
          pip install -r news-hub/requirements-reels.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: adeel-raja-whisper-small-v1

      - name: Restore independent Reels state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/reels-state
          cd /tmp/reels-state
          git init -q
          git config user.name "adeel-raja-reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git remote add origin "$REMOTE"
          if git ls-remote --exit-code --heads "$REMOTE" reels-data >/dev/null 2>&1; then
            git fetch -q origin reels-data
            git checkout -q -B reels-data FETCH_HEAD
          else
            git checkout -q -b reels-data
          fi
          touch clips-processed.json news-processed.json

      - name: Read the News Hub published queue without modifying it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" bot-data || true
          if git cat-file -e FETCH_HEAD:queue.json 2>/dev/null; then
            git show FETCH_HEAD:queue.json > /tmp/news-queue.json
          else
            printf '{"items":[]}' > /tmp/news-queue.json
          fi

      - name: Optional YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > news-hub/cookies.txt
          fi

      - name: Run YouTube video-to-clip Reels bot
        working-directory: news-hub
        env:
          REEL_STATE_FILE: /tmp/reels-state/clips-processed.json
          REEL_CHANNELS: ${{ vars.REEL_CHANNELS }}
          REEL_MAX_VIDEOS: "2"
          REEL_CLIPS_PER_VIDEO: "1"
          REEL_MODE: blur
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python reels_main.py

      - name: Run animated News Hub story Reels
        if: ${{ always() }}
        working-directory: news-hub
        env:
          NEWS_REEL_STATE_FILE: /tmp/reels-state/news-processed.json
          NEWS_REEL_QUEUE_FILE: /tmp/news-queue.json
          NEWS_REELS_MAX_PER_RUN: "1"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python news_reels.py

      - name: Save separate Reels state
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd /tmp/reels-state
          git add clips-processed.json news-processed.json
          if ! git diff --cached --quiet; then
            git commit -m "reels: update independent processing memory"
            git push -u origin HEAD:reels-data
          fi
