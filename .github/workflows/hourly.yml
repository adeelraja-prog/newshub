name: news-hub
on:
  push:
    paths:
      - ".github/workflows/hourly.yml"
      - "news-hub/main.py"
      - "news-hub/editorial.py"
      - "news-hub/editorial_policy.py"
      - "news-hub/editorial_quality.py"
      - "news-hub/sources.py"
      - "news-hub/poster.py"
      - "news-hub/tests/**"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the report, queue plan and posters, publish nothing, save nothing"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: news-hub
defaults:
  run:
    working-directory: news-hub   # the project lives in the news-hub folder of the repo
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-hub/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 libraqm0
      - run: pip install -r requirements.txt
      - name: Restore saved memory (kept on its own branch so your main branch stays clean)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/data && cd /tmp/data && git init -q
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$REMOTE" bot-data >/dev/null 2>&1; then
            git fetch -q "$REMOTE" bot-data && git checkout -q -B bot-data FETCH_HEAD
          else
            cp "${GITHUB_WORKSPACE}/news-hub/state.json" "${GITHUB_WORKSPACE}/news-hub/queue.json" . 2>/dev/null || true
          fi
      - name: Validate newsroom Python files
        run: python -m py_compile main.py editorial.py poster.py sources.py controversy.py news_memory.py editorial_policy.py editorial_quality.py && python -m unittest discover -s tests -v
      - run: python main.py
        env:
          STATE_DIR: /tmp/data
          DRY_RUN: ${{ github.event_name == 'push' && '1' || (github.event.inputs.dry_run == 'true' && '1' || '') }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Download posters and report (dry run preview)
        if: ${{ always() && (github.event_name == 'push' || github.event.inputs.dry_run == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: posters-and-report
          path: |
            news-hub/posters/
            news-hub/reports/
          if-no-files-found: ignore
      - name: Save memory
        if: ${{ always() && github.event_name != 'push' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd /tmp/data
          git config user.name "newshub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git rev-parse --verify -q HEAD >/dev/null; then git commit -q --amend -m "bot data" ; else git commit -q -m "bot data"; fi
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:bot-data
