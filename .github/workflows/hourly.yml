name: news-hub
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make posters but do not post to Facebook or WhatsApp"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: news-hub
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 libraqm0
      - run: pip install -r news-hub/requirements.txt
      - run: python news-hub/main.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          WHATSAPP_BRIDGE_URL: ${{ secrets.WHATSAPP_BRIDGE_URL }}
          WHATSAPP_BRIDGE_TOKEN: ${{ secrets.WHATSAPP_BRIDGE_TOKEN }}
      - name: Download posters (dry run preview)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: posters
          path: posters/
          if-no-files-found: ignore
      - name: Save state and posters
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "newshub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state.json posters
          git diff --cached --quiet || (git commit -m "update" && git push)
