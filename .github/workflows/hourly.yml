name: news-hub
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the report, queue plan and posters, publish nothing, save nothing"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: news-hub
defaults:
  run:
    working-directory: news-hub   # the project lives in the news-hub folder of the repo
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-hub/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 libraqm0 ffmpeg
      - run: pip install -r requirements.txt
      - name: Restore saved memory (kept on its own branch so your main branch stays clean)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/data && cd /tmp/data && git init -q
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$REMOTE" bot-data >/dev/null 2>&1; then
            git fetch -q "$REMOTE" bot-data && git checkout -q -B bot-data FETCH_HEAD
          else
            cp "${GITHUB_WORKSPACE}/news-hub/state.json" "${GITHUB_WORKSPACE}/news-hub/queue.json" . 2>/dev/null || true
          fi
      - run: python main.py
        env:
          STATE_DIR: /tmp/data
          DRY_RUN: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          WHATSAPP_BRIDGE_URL: ${{ secrets.WHATSAPP_BRIDGE_URL }}
          WHATSAPP_BRIDGE_TOKEN: ${{ secrets.WHATSAPP_BRIDGE_TOKEN }}
      - name: Save generated posters, reels and report as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adeel-raja-news-assets
          path: |
            news-hub/posters/
            news-hub/reels/
            news-hub/reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save memory
        if: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd /tmp/data
          git config user.name "newshub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git rev-parse --verify -q HEAD >/dev/null; then git commit -q --amend -m "bot data" ; else git commit -q -m "bot data"; fi
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:bot-data
